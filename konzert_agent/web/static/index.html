<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konzertkalender</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<script src="static/theme.js"></script>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#16130f; --muted:#6f685d; --line:#e2dccf;
  --accent:#e2471b; --accent-ink:#fff; --new:#0f7b5f; --warn:#b3261e; --chip:#ece6d9;
  --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 20px -12px rgba(0,0,0,.25);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121110; --panel:#1b1a18; --ink:#f1ece2; --muted:#9a9286; --line:#2e2b27;
    --accent:#ff6a3d; --accent-ink:#130c08; --new:#3fcf9f; --warn:#ff7a6e; --chip:#26241f;
    --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px -14px rgba(0,0,0,.8);
  }
}
:root[data-theme="dark"]{
  --bg:#121110; --panel:#1b1a18; --ink:#f1ece2; --muted:#9a9286; --line:#2e2b27;
  --accent:#ff6a3d; --accent-ink:#130c08; --new:#3fcf9f; --warn:#ff7a6e; --chip:#26241f;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px -14px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Archivo,system-ui,sans-serif;font-size:15px}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.mono{font-family:"JetBrains Mono",ui-monospace,monospace}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;
  padding:28px 28px 18px;border-bottom:2px solid var(--ink)}
h1{margin:0;font-size:clamp(30px,5vw,54px);font-weight:800;letter-spacing:-.03em;line-height:.9}
h1 span{color:var(--accent)}
.sub{color:var(--muted);margin-top:8px;font-size:13px}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1.5px solid var(--ink);background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;
  font-weight:600;font-size:13px;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn[disabled]{opacity:.5;cursor:wait}

.layout{display:grid;grid-template-columns:270px 1fr;gap:0;min-height:calc(100vh - 120px)}
aside{border-right:1px solid var(--line);padding:20px 22px;position:sticky;top:0;align-self:start;max-height:100vh;overflow:auto}
main{padding:20px 28px 60px;min-width:0}
.group{margin-bottom:22px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);margin-bottom:8px;font-weight:600}
input[type=search]{width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--panel)}
input[type=search]:focus{outline:none;border-color:var(--ink)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:none;background:var(--chip);padding:6px 11px;border-radius:999px;cursor:pointer;font-size:13px}
.chip.on{background:var(--ink);color:var(--bg)}
.venue{display:flex;align-items:center;gap:9px;padding:6px 4px;border-radius:8px;cursor:pointer;font-size:14px}
.venue:hover{background:var(--chip)}
.venue input{accent-color:var(--accent);width:16px;height:16px;margin:0}
.venue .n{margin-left:auto;color:var(--muted);font-size:12px}
.venue,.city-h{position:relative}
.only{position:absolute;right:30px;top:50%;transform:translateY(-50%);border:1px solid var(--line);background:var(--panel);
  border-radius:999px;font-size:11px;padding:1px 8px;cursor:pointer;color:var(--muted);opacity:0;transition:opacity .15s}
.fold{display:block;margin:-2px 0 6px}
.venue:hover .only,.city-h:hover .only,.only:focus{opacity:1}
@media (hover:none){.only{opacity:1}}
.only:hover{border-color:var(--ink);color:var(--ink)}
.foot{border-top:1px solid var(--line);margin-top:40px;padding:18px 28px 28px;color:var(--muted);font-size:12px;line-height:1.6}
.foot b{color:var(--ink);font-weight:600}
.dot{width:7px;height:7px;border-radius:50%;background:var(--new);flex:none}
.dot.err{background:var(--warn)} .dot.none{background:var(--line)}
.venue small{display:block;color:var(--muted);font-size:11px}
.toggle{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.toggle input{accent-color:var(--accent);width:16px;height:16px}
.linkish{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:12px;padding:0}

.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:none;background:transparent;padding:7px 14px;cursor:pointer;font-weight:600;font-size:13px}
.seg button.on{background:var(--ink);color:var(--bg)}
.count{color:var(--muted);font-size:13px}

/* Liste */
.month-h{font-size:28px;font-weight:800;letter-spacing:-.02em;margin:26px 0 10px;display:flex;align-items:baseline;gap:10px}
.month-h small{font-size:13px;color:var(--muted);font-weight:500}
.day{display:grid;grid-template-columns:72px 1fr;gap:14px;padding:14px 0;border-top:1px solid var(--line)}
.dlabel{line-height:1}
.dlabel .wd{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}
.dlabel .dn{font-size:34px;font-weight:800;letter-spacing:-.03em}
.dlabel.today .dn{color:var(--accent)}
.evs{display:flex;flex-direction:column;gap:8px}
.ev{display:flex;gap:12px;align-items:flex-start;background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:11px 14px;text-decoration:none;box-shadow:var(--shadow);transition:transform .12s}
.ev:hover{transform:translateX(3px);border-color:var(--ink)}
.ev .t{font-weight:600;font-size:16px;line-height:1.25;text-decoration:none;display:block}
.ev .t:hover{text-decoration:underline}
.ev .body{flex:1;min-width:0}
.ev.going{border-color:var(--accent)}
.marks{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:8px;font-size:12px}
.mk{border:1px solid var(--line);background:transparent;border-radius:999px;padding:3px 10px;cursor:pointer;font-size:12px;color:var(--muted)}
.mk:hover{border-color:var(--ink);color:var(--ink)}
.mk.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.mk.on.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.marks select{font-size:12px;padding:2px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.marks select.todo{border-color:var(--warn);color:var(--warn)}
.friends{color:var(--muted)}
.hint{font-size:12px;color:var(--muted);margin-top:6px;line-height:1.4}
.layout.solo{grid-template-columns:1fr}
.custom-range{display:flex;align-items:center;gap:6px;margin-top:10px}
.custom-range input{flex:1;min-width:0;padding:6px 8px;border:1.5px solid var(--line);border-radius:8px;background:var(--panel);font-size:13px}
.custom-range input:focus{outline:none;border-color:var(--ink)}
.city-h{display:flex;align-items:center;gap:6px;padding:5px 4px;border-radius:8px;font-size:14px;font-weight:600}
.city-h:hover{background:var(--chip)}
.city-h input{accent-color:var(--accent)}
.city-h .caret{border:none;background:none;cursor:pointer;width:20px;padding:0;color:var(--muted);font-size:12px}
.city-h .nm{flex:1;cursor:pointer}
.city-h .n{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400}
.city-v{padding-left:18px}
.seg.sm button{padding:5px 11px;font-size:12px}
.swatches{display:flex;gap:8px;margin-top:12px}
.swatch{width:24px;height:24px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 2px var(--bg)}
.swatch.on{border-color:var(--ink)}
.layout.solo aside{display:none}
.dash-h{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:28px 0 6px;display:flex;align-items:baseline;gap:10px}
.dash-h small{font-size:13px;color:var(--muted);font-weight:500}
.dash-h.warn{color:var(--warn)}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 16px;min-width:120px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--muted)}
.stat.warn b{color:var(--warn)}
.dash-set{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-top:30px;max-width:640px}
.dash-set + .dash-set{margin-top:12px}
details.past summary{cursor:pointer;list-style:none}
details.past summary::-webkit-details-marker{display:none}
details.past summary .dash-h::before{content:"▸ ";color:var(--muted)}
details.past[open] summary .dash-h::before{content:"▾ "}
#whoName{text-decoration:none;color:inherit}
#whoName:hover{color:var(--ink)}
.seg button .n{background:var(--warn);color:#fff;border-radius:999px;font-size:10px;padding:1px 6px;margin-left:5px}
.ev .meta{color:var(--muted);font-size:13px;margin-top:3px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lineup{font-size:13px;margin-top:6px;display:flex;flex-direction:column;gap:3px}
.lineup .act{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.lineup .role{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em;min-width:30px}
.lineup .am{color:var(--muted);font-size:12px}
.lineup .mk{padding:1px 8px;font-size:11px}
.ev .time{font-family:"JetBrains Mono",monospace;font-size:13px;min-width:44px;padding-top:2px;color:var(--muted)}
.badge{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;padding:2px 7px;border-radius:999px}
.b-new{background:var(--new);color:var(--panel)} .b-fol{background:var(--accent);color:var(--accent-ink)}
.mk.fol.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.fchips .chip button{border:none;background:none;cursor:pointer;color:var(--muted);padding:0 0 0 6px;font-size:13px}
.fadd{display:flex;gap:8px;max-width:420px} .fadd input{flex:1;padding:7px 10px} .b-sold{background:var(--warn);color:#fff}
.b-cxl{border:1px solid var(--warn);color:var(--warn)}
.ev.cxl .t{text-decoration:line-through;opacity:.6}
.tag{background:var(--chip);padding:1px 7px;border-radius:6px;font-size:12px}
.pop{display:inline-flex;align-items:center;gap:5px;font-size:12px;color:var(--muted)}
.pop.star{color:var(--accent);font-weight:600}
.bars{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.bars i{width:3px;background:var(--line);border-radius:1px}
.bars i:nth-child(1){height:4px} .bars i:nth-child(2){height:7px} .bars i:nth-child(3){height:10px} .bars i:nth-child(4){height:12px}
.bars i.on{background:var(--accent)}
.chip small{opacity:.6;margin-left:4px}
.dlabel .mo{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-top:3px}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* Monat */
.cal-nav{display:flex;align-items:center;gap:10px}
.cal-nav h2{margin:0;font-size:24px;font-weight:800;min-width:200px}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);border-left:1px solid var(--line)}
.grid .wh{padding:8px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);border-right:1px solid var(--line);border-bottom:1px solid var(--line)}
.cell{min-height:118px;padding:6px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:var(--panel)}
.cell.out{background:transparent;opacity:.45}
.cell .num{font-size:13px;font-weight:700;margin-bottom:4px}
.cell.today .num{color:var(--accent)}
.pill{display:block;font-size:12px;line-height:1.25;padding:3px 6px;margin-bottom:3px;border-radius:6px;background:var(--chip);
  text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-left:3px solid var(--vc,var(--accent))}
.pill:hover{background:var(--ink);color:var(--bg)}
.more{font-size:11px;color:var(--muted)}

.empty{padding:60px 0;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;
  border-radius:999px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.filters-btn{display:none}
.who{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.who form{margin:0}

@media (max-width:860px){
  header{padding:20px 16px 14px}
  .layout{grid-template-columns:1fr}
  aside{position:static;max-height:none;border-right:none;border-bottom:1px solid var(--line);padding:16px;display:none}
  aside.open{display:block}
  main{padding:16px 16px 60px}
  .filters-btn{display:inline-flex}
  .day{grid-template-columns:52px 1fr;gap:10px}
  .dlabel .dn{font-size:26px}
  .cell{min-height:64px;padding:3px}
  .pill{font-size:0;height:7px;padding:0;margin:2px 0;border-left:none;background:var(--vc,var(--accent))}
  .more{font-size:10px}
}
</style>
</head>
<body>
<header>
  <div>
    <h1>Konzert<span>kalender</span></h1>
    <div class="sub" id="status">lade …</div>
  </div>
  <div class="actions">
    <button class="btn filters-btn" id="filtersBtn">Filter</button>
    <a class="btn" id="icsLink" href="calendar.ics" title="In Kalender-App abonnieren (aktuelle Filter)">📅 iCal-Abo</a>
    <button class="btn primary" id="runBtn" hidden title="Alle Locations jetzt neu einlesen">Jetzt prüfen</button>
    <a class="btn primary" id="loginBtn" href="login" hidden>Anmelden</a>
    <span class="who" id="who" hidden><a id="whoName" href="#meine" title="Meine Konzerte"></a>
      <form method="post" action="logout"><button class="btn" type="submit">Abmelden</button></form></span>
  </div>
</header>

<div class="layout">
  <aside id="aside">
    <div class="group">
      <div class="label">Suche</div>
      <input type="search" id="q" placeholder="Band, Genre …">
    </div>
    <div class="group" id="rangeGroup">
      <div class="label">Zeitraum</div>
      <div class="chips" id="range"></div>
      <div class="custom-range" id="customRange" hidden>
        <input type="date" id="dFrom" aria-label="von"><span>–</span><input type="date" id="dTo" aria-label="bis">
      </div>
    </div>
    <div class="group">
      <div class="label">Stadt</div>
      <div class="chips" id="cities"></div>
    </div>
    <div class="group">
      <div class="label">Typ</div>
      <div class="chips" id="kinds"></div>
    </div>
    <div class="group" id="genreGroup" hidden>
      <div class="label">Genre</div>
      <div class="chips" id="genres"></div>
    </div>
    <div class="group" id="popGroup" hidden>
      <div class="label">Popularität</div>
      <div class="chips" id="pops"></div>
    </div>
    <div class="group" id="mineGroup" hidden>
      <div class="label">Meine Konzerte</div>
      <div class="chips" id="mine"></div>
    </div>
    <div class="group">
      <label class="toggle"><input type="checkbox" id="onlyNew"> Nur neu angekündigt</label>
    </div>
    <div class="group">
      <div class="label" style="display:flex;justify-content:space-between">Locations
        <span><button class="linkish" id="allV">alle</button> · <button class="linkish" id="noneV">keine</button></span></div>
      <button class="linkish fold" id="foldV"></button>
      <div id="venues"></div>
    </div>
    <div class="group">
      <div class="label">Einstellungen</div>
      <div class="seg sm" id="themeSeg"><button data-theme-k="system">System</button><button data-theme-k="light">Hell</button><button data-theme-k="dark">Dunkel</button></div>
      <div class="swatches" id="accents"></div>
      <div id="shareBox" hidden style="margin-top:14px">
        <label class="toggle"><input type="checkbox" class="share-toggle"> Markierungen teilen</label>
        <div class="hint">Andere Angemeldete sehen, wohin du gehst – und du siehst, wohin sie gehen (nur wer auch teilt).</div>
      </div>
    </div>
  </aside>

  <main>
    <div class="toolbar">
      <div class="tools">
        <div class="seg" id="viewSeg"><button data-view="list" class="on">Liste</button><button data-view="month">Monat</button><button data-view="archive" title="Vergangene Events">Archiv</button><button data-view="mine" id="mineTab" hidden>Meine</button></div>
        <div class="seg" id="sortSeg" title="Sortierung der Liste"><button data-sort="date" class="on">Datum</button><button data-sort="pop">Popularität</button></div>
      </div>
      <span class="count" id="count"></span>
    </div>
    <div id="view"></div>
  </main>
</div>
<footer class="foot" id="foot"></footer>
<div class="toast" id="toast"></div>

<script>
const WD = ["So","Mo","Di","Mi","Do","Fr","Sa"];
const MONTHS = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const PALETTE = ["#e2471b","#1d6fd8","#0f7b5f","#b0399b","#c58a00","#5b4bd6","#d0365a","#2a8f8f","#7a6a3a","#4d7c0f"];
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const iso = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
const parse = s => { const [y,m,d] = s.split("-").map(Number); return new Date(y, m-1, d); };
const todayIso = iso(new Date());

const store = {
  get(k, d) { try { const v = localStorage.getItem("ka:"+k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("ka:"+k, JSON.stringify(v)); } catch {} }
};

let venues = [], events = [], meta = {}, me = null, marks = {mine: {}, others: {}, share: false}, myEvents = [];
let tg = {available: false}, tgLink = null, tgPoll = null;   // Telegram pro Benutzer
let archive = null;                          // vergangene Events – erst beim ersten Blick ins Archiv geladen
let follows = {follows: [], events: []}, followedUids = new Map();   // Bands folgen: uid -> [Bands]
const state = {
  q: "", range: store.get("range", "all"), city: store.get("city", ""), onlyNew: false,
  hidden: new Set(store.get("hidden", [])), view: store.get("view", "list"), cal: new Date(),
  genres: new Set(store.get("genres", [])), pops: new Set(store.get("pops", [])), sort: store.get("sort", "date"),
  mine: store.get("mine", ""), kinds: new Set(store.get("kinds", [])),
  from: store.get("from", ""), to: store.get("to", ""), open: new Set(store.get("openCities", []))
};
state.cal.setDate(1);
if (location.hash === "#meine") state.view = "mine";

const RANGES = [["all","Alle"],["week","7 Tage"],["month","30 Tage"],["weekend","Wochenende"],["custom","Von – bis"]];
const KINDS = ["Konzert", "Party", "Andere"];
const POP_LEVELS = [["lokal","unter 1000 Fans"],["Szene","1000 – 20 000 Fans"],["bekannt","20 000 – 300 000 Fans"],["Star","über 300 000 Fans"]];
const x = e => e.extra || {};
const MARKS = [["interested","☆ Interessiert"],["going","✓ Gehe hin"]];
const TICKETS = [["none","Ticket: noch nicht"],["own","Ticket: selbst gekauft"],["other","Ticket: hat jemand anderes"]];
const MINE = [["","Alle"],["marked","Markiert"],["going","Gehe hin"],["noticket","Ohne Ticket"],["others","Andere gehen"]];
const isMember = () => !!(me && me.user);
// Kalender-Apps können sich nicht anmelden -> persönlicher Link mit geheimem Token
const myIcal = () => `ical/${encodeURIComponent(me.user.ical_token)}.ics`;
const myMark = e => marks.mine[e.uid];
// wie follows.follow_key / artists.lookup.norm in Python (nur zum Vergleichen, der Server bleibt massgebend)
const bandKey = s => String(s).normalize("NFKD").replace(/[\u0300-\u036f]/g, "").toLowerCase().replace(/&/g, "and")
  .replace(/^the\s+/, "").replace(/[^a-z0-9]/g, "");
const followedKey = name => (follows.follows.find(f => f.key === bandKey(name)) || {}).key;
const fans = n => n >= 1e6 ? (n/1e6).toFixed(1)+" Mio." : n >= 1e3 ? Math.round(n/1e3)+"k" : String(n);

function venueColor(id) { const i = venues.findIndex(v => v.id === id); return PALETTE[(i < 0 ? 0 : i) % PALETTE.length]; }

function rangeBounds() {
  const t = new Date(); t.setHours(0,0,0,0);
  if (state.range === "week") return [t, new Date(+t + 7*864e5)];
  if (state.range === "month") return [t, new Date(+t + 30*864e5)];
  if (state.range === "custom") return [state.from ? parse(state.from) : t, state.to ? parse(state.to) : null];
  if (state.range === "weekend") {
    const dow = t.getDay();
    const start = new Date(t);
    if (dow >= 1 && dow <= 5) start.setDate(t.getDate() + (5 - dow));   // nächster Freitag
    const sun = new Date(start); sun.setDate(start.getDate() + ((7 - start.getDay()) % 7));
    return [start, sun];
  }
  return [t, null];
}

function visible(src = events) {
  const [a, b] = rangeBounds();
  const q = state.q.trim().toLowerCase();
  const nd = meta.new_badge_days || 7;
  return src.filter(e => {
    if (state.hidden.has(e.venue_id)) return false;
    if (state.city && e.city !== state.city) return false;
    if (state.onlyNew && !e.is_new) return false;
    const d = parse(e.date), end = e.end_date ? parse(e.end_date) : d;
    if (state.view !== "archive" && (state.view === "list" || state.range !== "all")) {
      if (end < a) return false;
      if (b && d > b) return false;
    }
    if (state.kinds.size && !state.kinds.has(e.kind)) return false;
    if (state.genres.size && !(x(e).genres || []).some(g => state.genres.has(g))) return false;
    if (state.pops.size && !state.pops.has(x(e).popularity_label)) return false;
    if (isMember() && state.mine) {
      const m = myMark(e);
      if (state.mine === "marked" && !m) return false;
      if (state.mine === "going" && !(m && m.status === "going")) return false;
      if (state.mine === "noticket" && !(m && m.status === "going" && m.ticket === "none")) return false;
      if (state.mine === "others" && !marks.others[e.uid]) return false;
    }
    if (q) {
      const hay = [e.title, e.venue, ...e.tags, ...(x(e).genres || []), ...(x(e).styles || []),
                   ...(x(e).artists || []).map(a => a.name)].join(" ").toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function ago(ts) {
  if (!ts) return "nie";
  const m = Math.round((Date.now() - new Date(ts)) / 60000);
  if (m < 1) return "gerade eben";
  if (m < 60) return `vor ${m} Min.`;
  if (m < 48*60) return `vor ${Math.round(m/60)} Std.`;
  return `vor ${Math.round(m/1440)} Tagen`;
}

function venueRow(v) {
  const run = v.run;
  const cls = !run ? "none" : run.last_error ? "err" : "";
  const tip = !run ? "noch nicht geprüft" : run.last_error ? `Fehler: ${run.last_error}` : `geprüft ${ago(run.last_run)}`;
  return `<label class="venue" title="${esc(tip)}">
    <input type="checkbox" data-v="${esc(v.id)}" ${state.hidden.has(v.id)?"":"checked"}>
    <span class="dot ${cls}" style="${cls?"":"background:"+venueColor(v.id)}"></span>
    <span>${esc(v.name)}${run && run.last_error ? "<small>⚠ Fehler</small>" : ""}</span>
    <button class="only" data-only="${esc(v.id)}" title="Nur ${esc(v.name)} anzeigen">nur</button>
    <span class="n">${v.upcoming}</span></label>`;
}

function popBadge(e) {
  const lvl = POP_LEVELS.findIndex(([k]) => k === x(e).popularity_label);
  if (lvl < 0) return "";
  const who = (x(e).artists || []).filter(a => a.fans != null && (a.confidence === "hoch" || a.confidence === "mittel"))
    .map(a => `${a.name}${a.country ? " ("+a.country+")" : ""}: ${fans(a.fans)} Fans auf Deezer`).join("\n");
  const bars = [0,1,2,3].map(i => `<i class="${i <= lvl ? "on" : ""}"></i>`).join("");
  return `<span class="pop ${lvl === 3 ? "star" : ""}" title="Popularität ${x(e).popularity}/100\n${esc(who)}"><span class="bars">${bars}</span>${esc(x(e).popularity_label)}</span>`;
}

function evCard(e) {
  const badges = [
    e.is_new && !isPast(e) ? `<span class="badge b-new">neu</span>` : "",
    e.sold_out ? `<span class="badge b-sold">ausverkauft</span>` : "",
    e.cancelled ? `<span class="badge b-cxl">abgesagt</span>` : "",
    isMember() && followedUids.has(e.uid) ? `<span class="badge b-fol" title="Du folgst: ${esc(followedUids.get(e.uid).join(", "))}">★ ${esc(followedUids.get(e.uid).join(", "))}</span>` : "",
  ].join("");
  const genres = x(e).genres && x(e).genres.length ? x(e).genres : e.tags;
  const styleTip = (x(e).styles || []).join(", ");
  const tags = genres.slice(0,3).map(t => `<span class="tag" title="${esc(styleTip)}">${esc(t)}</span>`).join("");
  const range = e.end_date ? ` · bis ${parse(e.end_date).toLocaleDateString("de-CH",{day:"numeric",month:"short"})}` : "";
  const price = e.extra && e.extra.price ? ` · ${esc(e.extra.price)}` : "";
  const m = myMark(e);
  return `<div class="ev ${e.cancelled?"cxl":""} ${m && m.status==="going"?"going":""}" style="border-left:4px solid ${venueColor(e.venue_id)}">
    <span class="time">${esc(e.time || "")}</span>
    <span class="body"><a class="t" href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>
    <div class="meta"><span>${esc(e.venue)}${e.city ? ", "+esc(e.city) : ""}${range}${price}</span>${badges}${popBadge(e)}${tags}</div>
    ${lineup(e)}${markBar(e)}</span></div>`;
}

const actName = a => a.name || a.query;
function followBtn(name, short = false) {   // Band folgen (nur Angemeldete); short: nur ★/＋ (im Line-up)
  if (!isMember()) return "";
  const on = !!followedKey(name);
  return `<button class="mk fol ${on?"on":""}" data-follow="${esc(name)}" title="${on ? "Nicht mehr folgen" : "Neue Shows melden"}: ${esc(name)}">${on?"★":"＋"}${short ? "" : " " + esc(name)}</button>`;
}

function lineup(e) {                        // mehrere Acts im Titel: Hauptact, darunter «mit …» (Support / weitere)
  const acts = x(e).artists || [];
  if (acts.length < 2) return "";
  return `<div class="lineup">${acts.map((a, i) => {
    const info = [a.country, (a.styles || [])[0] || (a.genres || [])[0], a.fans != null ? fans(a.fans) + " Fans" : ""].filter(Boolean).join(" · ");
    return `<div class="act"><span class="role">${i ? "mit" : ""}</span>${i ? esc(actName(a)) : `<b>${esc(actName(a))}</b>`}
      ${info ? `<span class="am">${esc(info)}</span>` : ""}${followBtn(actName(a), true)}</div>`;
  }).join("")}</div>`;
}

function markBar(e) {                       // nur für Angemeldete
  if (!isMember()) return "";
  const m = myMark(e), uid = esc(e.uid);
  const btns = MARKS.map(([k, l]) => `<button class="mk ${m && m.status===k?"on":""} ${k==="going"?"go":""}" data-uid="${uid}" data-mark="${k}">${l}</button>`).join("");
  const ticket = m && m.status === "going" ? `<select data-uid="${uid}" data-ticket class="${m.ticket==="none"?"todo":""}">${
    TICKETS.map(([k, l]) => `<option value="${k}" ${m.ticket===k?"selected":""}>${l}</option>`).join("")}</select>` : "";
  const others = marks.others[e.uid] || [];
  const friends = others.length ? `<span class="friends" title="${esc(others.map(o => o.user + (o.status==="going"?": geht hin":": interessiert")).join("\n"))}">👥 ${
    others.map(o => esc(o.user) + (o.status==="going" ? " ✓" : " ☆")).join(", ")}</span>` : "";
  // Band folgen: bei einem Act hier, bei mehreren im Line-up
  const acts = x(e).artists || [];
  const fol = acts.length === 1 && acts[0].confidence !== "keine" ? followBtn(actName(acts[0])) : "";
  return `<div class="marks">${btns}${ticket}${fol}${friends}</div>`;
}

function renderList(list, past = false) {       // past: Archiv, neueste zuerst
  if (!list.length) return past && !archive.length
    ? `<div class="empty">Noch keine vergangenen Events – das Archiv füllt sich mit der Zeit (Events bleiben nach ihrem Datum gespeichert).</div>`
    : `<div class="empty">Keine ${past ? "vergangenen " : ""}Konzerte für diese Filter.</div>`;
  const byDay = new Map();
  list.forEach(e => { const k = !past && e.date < todayIso && e.end_date ? todayIso : e.date; (byDay.get(k) || byDay.set(k, []).get(k)).push(e); });
  let html = "", lastMonth = "";
  const days = [...byDay.keys()].sort();
  (past ? days.reverse() : days).forEach(k => {
    const d = parse(k), mk = k.slice(0,7);
    if (mk !== lastMonth) {
      const n = list.filter(e => e.date.slice(0,7) === mk).length;
      html += `<div class="month-h">${MONTHS[d.getMonth()]} <small>${d.getFullYear()} · ${n}</small></div>`;
      lastMonth = mk;
    }
    html += `<div class="day"><div class="dlabel ${k===todayIso?"today":""}"><div class="wd">${k===todayIso?"heute":WD[d.getDay()]}</div><div class="dn">${d.getDate()}</div></div>
      <div class="evs">${byDay.get(k).map(evCard).join("")}</div></div>`;
  });
  return html;
}

function datedRow(e) {                     // Event mit vollem Datum (für Listen, die nicht nach Tag gruppiert sind)
  const d = parse(e.date);
  return `<div class="day"><div class="dlabel ${e.date===todayIso?"today":""}"><div class="wd">${e.date===todayIso?"heute":WD[d.getDay()]}</div>
    <div class="dn">${d.getDate()}</div><div class="mo">${MONTHS[d.getMonth()].slice(0,3)} ${d.getFullYear() % 100}</div></div>
    <div class="evs">${evCard(e)}</div></div>`;
}

function renderByPopularity(list) {
  if (!list.length) return `<div class="empty">Keine Konzerte für diese Filter.</div>`;
  const pop = e => x(e).popularity ?? -1;
  return [...list].sort((a, b) => pop(b) - pop(a) || a.date.localeCompare(b.date)).map(datedRow).join("");
}

const isPast = e => (e.end_date || e.date) < todayIso;

function mineGroups() {
  // Markierung aus marks.mine (aktuell, auch nach Änderungen ohne Neuladen), sonst die vom Server
  const withMark = myEvents.map(e => ({e, m: marks.mine[e.uid]})).filter(o => o.m);
  const up = withMark.filter(o => !isPast(o.e));
  return {
    noTicket: up.filter(o => o.m.status === "going" && o.m.ticket === "none").map(o => o.e),
    going: up.filter(o => o.m.status === "going" && o.m.ticket !== "none").map(o => o.e),
    interested: up.filter(o => o.m.status === "interested").map(o => o.e),
    past: withMark.filter(o => isPast(o.e)).map(o => o.e).reverse(),
  };
}

function currentFilter() {                  // Filter der Seitenleiste – für «Nur passende» Telegram-Meldungen
  const shown = venues.filter(v => !state.hidden.has(v.id) && (!state.city || v.city === state.city)).map(v => v.id);
  return { venues: shown.length === venues.length ? [] : shown, genres: [...state.genres], kinds: [...state.kinds], pops: [...state.pops] };
}

function filterText(f) {
  const parts = [];
  if (f.venues && f.venues.length) {
    const names = venues.filter(v => f.venues.includes(v.id)).map(v => v.name);
    parts.push(names.length <= 3 ? names.join(", ") : `${names.length} von ${venues.length} Locations`);
  }
  if (f.kinds && f.kinds.length) parts.push(f.kinds.join(", "));
  if (f.genres && f.genres.length) parts.push(f.genres.join(", "));
  if (f.pops && f.pops.length) parts.push("Popularität: " + f.pops.join(", "));
  return parts.length ? parts.join(" · ") : "keine Einschränkung (wie «Alle»)";
}

function renderFollows() {
  const chips = follows.follows.map(f => `<span class="chip">★ ${esc(f.name)}<button data-unfollow="${esc(f.key)}" title="Nicht mehr folgen">×</button></span>`).join("");
  return `<div class="dash-set"><div class="label">Bands, denen ich folge</div>
    ${chips ? `<div class="fchips">${chips}</div>` : ""}
    <form class="fadd" id="followForm"><input type="search" id="followName" placeholder="Bandname" maxlength="100">
      <button class="btn" type="submit">Folgen</button></form>
    <div class="hint">Shows dieser Bands erscheinen oben unter «★ Gefolgte Bands» und mit ★ in der Liste – auch als
      Support-Band (Name als ganze Wörter im Titel). ${tg.available ? "Neue Shows kommen per Telegram, wenn verbunden." : ""}
      In der Liste geht's auch mit ＋ neben dem Konzert.</div></div>`;
}

async function setFollow(name, key) {      // key = entfolgen
  const r = key ? await api("api/follows/" + encodeURIComponent(key), { method: "DELETE" })
    : await api("api/follows", { method: "POST", headers: {"content-type": "application/json"}, body: JSON.stringify({name}) });
  if (r.error) { toast(r.error); return; }
  setFollows(r); render();
  toast(key ? "Nicht mehr gefolgt" : `Du folgst ${name}`);
}

function setFollows(r) {
  follows = r;
  followedUids = new Map(r.events.map(e => [e.uid, e.follows]));
}

function renderTelegram() {
  if (!tg.available) return "";
  if (!tg.linked) {
    const link = tgLink ? `<div class="tools"><a class="btn" href="${esc(tgLink.url)}" target="_blank" rel="noopener">In Telegram öffnen →</a></div>

      : `<div class="tools"><button class="btn" data-tg="link">✈️ Telegram verbinden</button></div>

    ${p.new === "filter" ? `<div class="hint">Filter: <b>${esc(filterText(p.filter))}</b>

      Neue Shows von Bands, denen ich folge – immer (auch bei «Aus»)</label>
    <label class="toggle" style="margin-top:6px"><input type="checkbox" class="tg-cancel" ${p.cancelled?"checked":""}>
      Absagen von Konzerten melden, die ich markiert habe</label>
    <div class="tools" style="margin-top:10px"><button class="btn" data-tg="test">Testnachricht</button>
      <button class="linkish" data-tg="unlink">Telegram trennen</button></div>
    <div class="hint">«Nur passende»: Locations, Typ, Genre und Popularität wie in der Seitenleiste – erst einstellen,
      dann übernehmen. Trennen geht auch mit /stop im Telegram-Chat.</div></div>`;

async function saveTg(prefs) {
  const r = await api("api/telegram", { method: "PUT", headers: {"content-type": "application/json"}, body: JSON.stringify(prefs) });
  if (r.error) { toast(r.error); return; }
  tg = r; render();
}

function watchTgLink() {                    // nach «Telegram verbinden»: warten, bis im Telegram «Start» gedrückt wurde
  clearInterval(tgPoll);
  const until = Date.now() + tgLink.minutes * 60e3;
  tgPoll = setInterval(async () => {
    const r = await api("api/telegram");
    if (r.linked || Date.now() > until) {
      clearInterval(tgPoll); tgLink = null; tg = r; render();
      if (r.linked) toast("Telegram verbunden ✓");
    }
  }, 3000);
}

function pillMark(e) {
  const m = isMember() && myMark(e);
  return !m ? "" : m.status === "going" ? "✓ " : "☆ ";
}

function renderMonth(list) {
  const c = state.cal, y = c.getFullYear(), m = c.getMonth();
  const first = new Date(y, m, 1), offset = (first.getDay() + 6) % 7;
  const start = new Date(y, m, 1 - offset);
  const byDay = new Map();
  list.forEach(e => {
    let d = parse(e.date); const end = e.end_date ? parse(e.end_date) : d;
    for (; d <= end; d = new Date(+d + 864e5)) { const k = iso(d); (byDay.get(k) || byDay.set(k, []).get(k)).push(e); }
  });
  let cells = ["Mo","Di","Mi","Do","Fr","Sa","So"].map(w => `<div class="wh">${w}</div>`).join("");
  for (let i = 0; i < 42; i++) {
    const d = new Date(start); d.setDate(start.getDate() + i);
    if (i >= 35 && d.getMonth() !== m) break;
    const k = iso(d), evs = byDay.get(k) || [];
    const shown = evs.slice(0, 4).map(e => `<a class="pill" style="--vc:${venueColor(e.venue_id)}" href="${esc(e.url)}" target="_blank" rel="noopener"
      title="${esc((e.time ? e.time+" · " : "") + e.title + " – " + e.venue)}">${pillMark(e)}${e.is_new?"● ":""}${esc(e.title)}</a>`).join("");
    const more = evs.length > 4 ? `<div class="more">+${evs.length - 4} weitere</div>` : "";
    cells += `<div class="cell ${d.getMonth()!==m?"out":""} ${k===todayIso?"today":""}"><div class="num">${d.getDate()}</div>${shown}${more}</div>`;
  }
  return `<div class="toolbar"><div class="cal-nav"><button class="btn" id="prevM">←</button>
    <h2>${MONTHS[m]} ${y}</h2><button class="btn" id="nextM">→</button><button class="linkish" id="todayM">heute</button></div></div>
    <div class="grid">${cells}</div>`;
}

function render() {
  if (state.view === "mine" && !isMember()) state.view = "list";
  const mine = state.view === "mine";
  $(".layout").classList.toggle("solo", mine);
  $("#filtersBtn").hidden = mine;
  if (location.hash !== (mine ? "#meine" : "") && (mine || location.hash === "#meine"))
    history.replaceState(null, "", mine ? "#meine" : location.pathname + location.search);
  const missing = mineGroups().noTicket.length;
  $("#mineTab").innerHTML = "Meine" + (missing ? `<span class="n" title="ohne Ticket">${missing}</span>` : "");
  const past = state.view === "archive";
  // Archiv und Monatsansicht in der Vergangenheit brauchen die vergangenen Events – einmal nachladen
  const monthStart = new Date(state.cal.getFullYear(), state.cal.getMonth(), 1);
  if (archive === null && (past || (state.view === "month" && monthStart <= new Date()))) {
    archive = undefined;                      // lädt
    api("api/events?past=1").then(a => { archive = a; render(); });
  }
  const list = past ? visible(archive || []) : visible(state.view === "month" && archive ? archive.concat(events) : events);
  $("#rangeGroup").hidden = past;             // Zeitraum gilt nur für Kommendes
  $("#count").textContent = mine ? `${myEvents.length} markiert` : `${list.length} ${past ? "vergangene " : ""}Event${list.length===1?"":"s"}`;
  document.querySelectorAll("#viewSeg button").forEach(b => b.classList.toggle("on", b.dataset.view === state.view));
  document.querySelectorAll("#sortSeg button").forEach(b => b.classList.toggle("on", b.dataset.sort === state.sort));
  $("#sortSeg").hidden = state.view !== "list" || !events.some(e => x(e).popularity != null);
  $("#view").innerHTML = mine ? renderMine() : past ? (archive ? renderList(list, true) : `<div class="empty">Archiv wird geladen …</div>`)
    : state.view === "month" ? renderMonth(list)
    : state.sort === "pop" && !$("#sortSeg").hidden ? renderByPopularity(list) : renderList(list);
  if (state.view === "month") {
    $("#prevM").onclick = () => { state.cal.setMonth(state.cal.getMonth() - 1); render(); };
    $("#nextM").onclick = () => { state.cal.setMonth(state.cal.getMonth() + 1); render(); };
    $("#todayM").onclick = () => { state.cal = new Date(); state.cal.setDate(1); render(); };
  }
  const shownVenues = venues.filter(v => !state.hidden.has(v.id) && (!state.city || v.city === state.city)).map(v => v.id);
  const p = new URLSearchParams();
  if (shownVenues.length !== venues.length) p.set("venues", shownVenues.join(","));
  if (state.q) p.set("q", state.q);
  state.genres.forEach(g => p.append("genre", g));
  state.pops.forEach(k => p.append("pop", k));
  state.kinds.forEach(k => p.append("kind", k));
  // Alle Events mit diesen Filtern. Angemeldete: persönlicher Token-Link (geht auch bei auth.guests: false)
  if (isMember()) p.set("all", "1");
  $("#icsLink").href = (isMember() ? myIcal() : "calendar.ics") + (p.toString() ? "?" + p : "");
}

function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 2600); }

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (r.status === 401) { location.href = "login?next=" + encodeURIComponent(location.pathname); throw new Error("abgemeldet"); }
  return r.json();
}

async function load() {
  const [m, v, e] = await Promise.all([api("api/me"), api("api/venues"), api("api/events")]);
  me = m; venues = v.venues; meta = v; events = e;
  $("#foot").innerHTML = `<b>© ${new Date().getFullYear()}${v.copyright ? " " + esc(v.copyright) : ""}</b> · Privates, nicht-kommerzielles Projekt.
    Alle Angaben ohne Gewähr – massgebend sind die Websites der Locations; Tickets nur dort kaufen.
    Programme © der jeweiligen Locations · Band-Infos: MusicBrainz, Deezer · v${esc(v.version)}`;
  if (archive) archive = await api("api/events?past=1");       // nach Mitternacht kommen Events dazu
  marks = isMember() ? await api("api/marks") : {mine: {}, others: {}, share: false};
  myEvents = isMember() ? await api("api/my-events") : [];
  if (isMember() && !tgLink) tg = await api("api/telegram");
  if (isMember()) setFollows(await api("api/follows"));
  $("#mineTab").hidden = !isMember();
  // Gäste sehen nur den Kalender; Funktionen für Angemeldete erst nach «Anmelden»
  const member = !!(me && me.user), guest = !!(me && me.auth && !me.user);
  $("#who").hidden = !member;
  $("#runBtn").hidden = guest;
  $("#loginBtn").hidden = !guest;
  $("#loginBtn").href = "login?next=" + encodeURIComponent(location.pathname + location.search);
  if (me && me.user) $("#whoName").textContent = "👤 " + me.user.username;
  const lastRun = venues.map(x => x.run && x.run.last_run).filter(Boolean).sort().pop();
  const errs = venues.filter(x => x.run && x.run.last_error).length;
  $("#status").textContent = `${events.length} kommende Events · ${venues.length} Locations · zuletzt geprüft ${ago(lastRun)}`
    + (errs ? ` · ${errs} mit Fehler` : "") + ` · v${v.version}`;
  renderSidebar(); render();
}

// Ereignisse
$("#q").addEventListener("input", e => { state.q = e.target.value; render(); });
$("#range").addEventListener("click", e => { const k = e.target.dataset.k; if (k === undefined) return; state.range = k; store.set("range", k); renderSidebar(); render(); });
$("#cities").addEventListener("click", e => { const k = e.target.dataset.k; if (k === undefined) return; state.city = k; store.set("city", k); renderSidebar(); render(); });
$("#onlyNew").addEventListener("change", e => { state.onlyNew = e.target.checked; render(); });
$("#venues").addEventListener("click", e => {
  const c = e.target.closest("[data-open]"); if (!c) return;
  const city = c.dataset.open;
  state.open.has(city) ? state.open.delete(city) : state.open.add(city);
  store.set("openCities", [...state.open]); renderSidebar();
});
$("#venues").addEventListener("change", e => {
  const city = e.target.dataset.city;
  if (city !== undefined) {                 // ganze Stadt an/aus
    venues.filter(v => (v.city || "–") === city).forEach(v => e.target.checked ? state.hidden.delete(v.id) : state.hidden.add(v.id));
    store.set("hidden", [...state.hidden]); renderSidebar(); render(); return;
  }
  const id = e.target.dataset.v; if (!id) return;
  e.target.checked ? state.hidden.delete(id) : state.hidden.add(id);
  store.set("hidden", [...state.hidden]); renderSidebar(); render();   // Stadt-Haken (halb/ganz) nachführen
});
$("#venues").addEventListener("click", e => {   // «nur»: alle anderen Locations ausblenden
  const b = e.target.closest("[data-only],[data-only-city]"); if (!b) return;
  e.preventDefault();                         // sonst schaltet das <label> die Checkbox um
  const keep = b.dataset.only ? [b.dataset.only] : venues.filter(v => (v.city || "–") === b.dataset.onlyCity).map(v => v.id);
  state.hidden = new Set(venues.map(v => v.id).filter(id => !keep.includes(id)));
  store.set("hidden", [...state.hidden]); renderSidebar(); render();
}, true);
$("#foldV").onclick = () => {
  if (state.open.size) state.open.clear(); else venues.forEach(v => state.open.add(v.city || "–"));
  store.set("openCities", [...state.open]); renderSidebar();
};
$("#allV").onclick = () => { state.hidden.clear(); store.set("hidden", []); renderSidebar(); render(); };
$("#noneV").onclick = () => { venues.forEach(v => state.hidden.add(v.id)); store.set("hidden", [...state.hidden]); renderSidebar(); render(); };
document.querySelectorAll("#viewSeg button").forEach(b => b.onclick = () => {
  state.view = b.dataset.view;
  if (state.view === "list" || state.view === "month") store.set("view", state.view);   // «Meine»/«Archiv» nicht als Standard
  render(); window.scrollTo(0, 0);
});
window.addEventListener("hashchange", () => { if (location.hash === "#meine" && state.view !== "mine") { state.view = "mine"; render(); } });
document.querySelectorAll("#sortSeg button").forEach(b => b.onclick = () => { state.sort = b.dataset.sort; store.set("sort", state.sort); render(); });
function toggleChip(set, key, k) {          // «Alle» leert die Auswahl, sonst Mehrfachauswahl
  if (k === "") set.clear(); else set.has(k) ? set.delete(k) : set.add(k);
  store.set(key, [...set]); renderSidebar(); render();
}
$("#kinds").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) toggleChip(state.kinds, "kinds", b.dataset.k); });
["from", "to"].forEach(k => $(k === "from" ? "#dFrom" : "#dTo").addEventListener("change", e => {
  state[k] = e.target.value; store.set(k, state[k]); render();
}));
$("#themeSeg").addEventListener("click", e => { const b = e.target.closest("[data-theme-k]"); if (b) { KA_THEME.setTheme(b.dataset.themeK); renderSidebar(); } });
$("#accents").addEventListener("click", e => { const b = e.target.closest("[data-accent]"); if (b) { KA_THEME.setAccent(b.dataset.accent); renderSidebar(); } });
$("#genres").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) toggleChip(state.genres, "genres", b.dataset.k); });
$("#pops").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) toggleChip(state.pops, "pops", b.dataset.k); });
$("#mine").addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return; state.mine = b.dataset.k; store.set("mine", state.mine); renderSidebar(); render(); });
document.addEventListener("change", async e => {
  if (!e.target.classList.contains("share-toggle")) return;
  await api("api/settings", { method: "PUT", headers: {"content-type": "application/json"}, body: JSON.stringify({share_marks: e.target.checked}) });
  marks = await api("api/marks");
  toast(e.target.checked ? "Markierungen werden geteilt" : "Markierungen sind wieder privat");
  if (!marks.share && state.mine === "others") state.mine = "";
  renderSidebar(); render();
});
async function saveMark(uid, mark) {        // mark null = entfernen
  const path = "api/marks/" + encodeURIComponent(uid);
  const r = mark ? await api(path, { method: "PUT", headers: {"content-type": "application/json"}, body: JSON.stringify(mark) })
                 : await api(path, { method: "DELETE" });
  if (r.error) { toast(r.error); return; }
  if (mark) marks.mine[uid] = r.mark; else delete marks.mine[uid];
  if (mark && !myEvents.some(e => e.uid === uid)) myEvents = await api("api/my-events");   // neu markiert
  render();
}
$("#view").addEventListener("click", e => {
  const b = e.target.closest("[data-mark]"); if (!b) return;
  const cur = marks.mine[b.dataset.uid];
  saveMark(b.dataset.uid, cur && cur.status === b.dataset.mark ? null           // nochmals klicken = entfernen
    : { status: b.dataset.mark, ticket: cur && cur.ticket || undefined });
});
$("#view").addEventListener("change", e => {
  const s = e.target.closest("[data-ticket]"); if (s) saveMark(s.dataset.uid, { status: "going", ticket: s.value });
});
$("#filtersBtn").onclick = () => $("#aside").classList.toggle("open");
function copyLink(href, msg) {
  const url = new URL(href, location.href).href;
  // Zwischenablage gibt's nur über HTTPS (oder localhost) – sonst den Link zum Kopieren anzeigen
  (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject())
    .then(() => toast(msg)).catch(() => prompt("Link kopieren und in der Kalender-App als Abo hinzufügen:", url));
}
const SECRET = " – nicht weitergeben, er funktioniert ohne Passwort";
$("#icsLink").addEventListener("click", ev => {
  ev.preventDefault();
  copyLink($("#icsLink").getAttribute("href"), isMember() ? "iCal-Link (alle Events mit diesen Filtern) kopiert" + SECRET
                                                       : "iCal-Link kopiert – in der Kalender-App als Abo hinzufügen");
});
$("#view").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-ical]"); if (!b) return;
  if (b.dataset.ical === "renew") {
    if (!confirm("Neuen Kalender-Link erzeugen? Bestehende Abos (auch «alle Events») funktionieren dann nicht mehr.")) return;
    const r = await api("api/ical-token", { method: "POST" });
    me.user.ical_token = r.ical_token;
    render();
    toast("Neuer Link erzeugt – in der Kalender-App neu abonnieren");
    return;
  }
  copyLink(myIcal() + (b.dataset.ical === "going" ? "?status=going" : ""), "Kalender-Link kopiert" + SECRET);
});
$("#view").addEventListener("click", async ev => {
  const n = ev.target.closest("[data-tg-new]");
  if (n) { saveTg({...tg.prefs, new: n.dataset.tgNew, filter: n.dataset.tgNew === "filter" && !Object.keys(tg.prefs.filter).length ? currentFilter() : tg.prefs.filter}); return; }
  const b = ev.target.closest("[data-tg]"); if (!b) return;
  const act = b.dataset.tg;
  if (act === "link") {
    const r = await api("api/telegram/link", { method: "POST" });
    if (r.error) { toast(r.error); return; }
    tgLink = r; render(); watchTgLink();
  } else if (act === "filter") {
    await saveTg({...tg.prefs, filter: currentFilter()}); toast("Filter übernommen");
  } else if (act === "test") {
    const r = await api("api/telegram/test", { method: "POST" });
    toast(r.error || "Testnachricht gesendet");
    if (r.error) { tg = await api("api/telegram"); render(); }
  } else if (act === "unlink") {
    if (!confirm("Telegram trennen? Du bekommst dann keine Meldungen mehr.")) return;
    await api("api/telegram", { method: "DELETE" });
    tg = await api("api/telegram"); render(); toast("Telegram getrennt");
  }
});
document.addEventListener("change", e => {
  if (e.target.classList.contains("tg-cancel")) saveTg({...tg.prefs, cancelled: e.target.checked});
  if (e.target.classList.contains("tg-follows")) saveTg({...tg.prefs, follows: e.target.checked});
});
$("#view").addEventListener("click", ev => {
  const f = ev.target.closest("[data-follow]");
  if (f) { setFollow(f.dataset.follow, followedKey(f.dataset.follow)); return; }
  const u = ev.target.closest("[data-unfollow]");
  if (u) setFollow(null, u.dataset.unfollow);
});
$("#view").addEventListener("submit", ev => {
  if (ev.target.id !== "followForm") return;
  ev.preventDefault();
  const name = $("#followName").value.trim();
  if (name) setFollow(name);
});
$("#runBtn").onclick = async () => {
  const b = $("#runBtn"); b.disabled = true; b.textContent = "prüfe …";
  await api("api/run", { method: "POST" });
  toast("Prüfung gestartet – dauert je nach Anzahl Locations ein paar Minuten");
  setTimeout(async () => { await load(); b.disabled = false; b.textContent = "Jetzt prüfen"; }, 20000);
};

load().catch(err => { $("#status").textContent = "Fehler beim Laden: " + err; });
setInterval(load, 10 * 60 * 1000);
</script>
