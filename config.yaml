# Konzert-Agent – Konfiguration
# ${VAR} wird aus der Umgebung (.env) ersetzt.

settings:
  database: data/konzerte.db
  interval_hours: 6            # wie oft alle Locations geprüft werden
  request_delay: 2.0           # Sekunden Pause zwischen Anfragen an denselben Server
  respect_robots: true         # robots.txt der Seiten beachten
  notify_on_first_run: false   # beim Erstimport einer Location NICHT alle Events melden
  new_badge_days: 7            # wie lange ein Event im Kalender als «neu» markiert ist
  base_url: ${KONZERT_BASE_URL:-}   # z.B. http://homelab.local:8080 – wird in Telegram verlinkt
  user_agent: "KonzertAgent/1.0 (privater Konzert-Notifier)"

# Login – Benutzer anlegen: python -m konzert_agent user add <name>   (siehe README «Login»)
auth:
  enabled: true
  guests: true               # ohne Login: Kalender nur ansehen («Jetzt prüfen» usw. nur angemeldet)
  session_days: 30           # angemeldet bleiben
  max_failures: 5            # nach 5 Fehlversuchen …
  lockout_minutes: 15        # … 15 Minuten Sperre (pro Benutzername und pro IP)
  secure_cookies: auto       # Secure-Cookie, sobald die Seite über HTTPS aufgerufen wird
  client_ip_header: ""       # hinter Cloudflare: CF-Connecting-IP (nur setzen, wenn der Proxy ihn setzt!)

notifiers:
  # Optional: alles fest an EINEN Chat (ohne Login). Normalerweise nicht nötig – Telegram läuft pro Benutzer
  # (user_telegram unten); wer alles will, wählt dort «Alle». Derselbe Bot darf für beides verwendet werden.
  - type: telegram
    enabled: false
    token: ${TELEGRAM_BOT_TOKEN}
    chat_id: ${TELEGRAM_CHAT_ID}
    silent: false

  # Optional: Home Assistant (Automation mit Webhook-Trigger)
  - type: webhook
    enabled: false
    url: http://homeassistant.local:8123/api/webhook/neue_konzerte

# Telegram pro Benutzer: jeder verbindet sich selbst («Meine» → «Telegram verbinden») und wählt, was er bekommt.
# Bot bei @BotFather → /newbot. Der Agent liest die Nachrichten an den Bot – kein anderes Programm darf das
# beim selben Bot tun (z.B. Home Assistant); Senden über denselben Bot (notifiers oben) ist kein Problem.
user_telegram:
  enabled: true
  token: ${TELEGRAM_USER_BOT_TOKEN:-}   # leer = Funktion ausgeblendet
  link_minutes: 15                       # so lange gilt ein Verbinden-Link

# Band-Infos (Genre, Stil, Popularität) über MusicBrainz + Deezer
# Prüfen: python -m konzert_agent artists <location>   Nach Korrekturen: … artists --save
artists:
  enabled: true
  refresh_days: 30          # Band-Infos so lange wiederverwenden, danach neu nachschlagen
  backfill_per_run: 40      # pro Lauf so viele bestehende Events ohne Band-Infos nachholen

  # Falsche Zuordnungen korrigieren – Schlüssel ist der Bandname aus dem Titel (Gross/klein egal):
  #   none                       -> nie zuordnen
  #   {deezer: <ID>}             -> feste Deezer-ID (deezer.com/artist/<ID>), liefert die Fans
  #   {mbid: <MusicBrainz-ID>}   -> fester MusicBrainz-Eintrag (musicbrainz.org/artist/<ID>), liefert Genres
  #   {genres: [indie rock]}     -> Genres/Stile von Hand (z.B. für lokale Bands ohne Einträge)
  overrides: {}
  #  Sports: none
  #  Omisdus: {genres: [indie pop]}

  # Titel, aus denen falsche Bandnamen gelesen werden: Regex auf den Titel -> Bands ([] = keine)
  titles:
    "^Goth Night": []
  #  "^Ska-Night": [Kalles Kaviar, Canastron]

# Eigene Quellen-Dateien (Python), siehe README «Eigene Quelle schreiben»
plugins: []

# --------------------------------------------------------------------------------------
# Locations
#   type: petzi          -> options.organiser = ID aus petzi.ch («Organisiert von»-Link)
#   type: exil / hallenstadion -> spezifische Scraper
#   type: jsonld / ical / css  -> generisch, ohne Code (Beispiele unten)
#   include / exclude    -> Regex auf Titel + Genre-Tags
# --------------------------------------------------------------------------------------
venues:
  # --- Aargau ---
  - id: kiff
    name: KiFF
    city: Aarau
    type: petzi
    options: {organiser: 5}
    exclude: ["Comedy", "buchklub", "Party", "Ü25"]

  - id: royal
    name: Kulturhaus Royal
    city: Baden
    type: petzi
    options: {organiser: 225}

  - id: werkk
    name: Werkk Kulturlokal
    city: Baden
    type: petzi
    options: {organiser: 322139}

  - id: piccadilly
    name: Piccadilly
    city: Brugg
    type: petzi
    options: {organiser: 202}

  # --- Zürich ---
  - id: bogenf
    name: Bogen F
    city: Zürich
    type: petzi
    options: {organiser: 136227}

  - id: helsinki
    name: Helsinki
    city: Zürich
    type: petzi
    options: {organiser: 149}

  - id: exil
    name: Exil
    city: Zürich
    type: exil
    url: https://exil.club
    options: {kinds: [live]}       # [live, dj] für auch DJ-Abende

  - id: hallenstadion
    name: Hallenstadion
    city: Zürich
    type: hallenstadion
    url: https://hallenstadion.ch/events/
    exclude: ["Swiss Cup", "Super10Kampf", "Eishockey", "Red Bull", "Cavalluna", "Holiday on Ice",
              "Felix Lobrecht", "Comedy", "Sport"]

  - id: xtra
    name: X-tra
    city: Zürich
    type: xtra                      # lädt «Alle anzeigen» nach (sonst nur 9 Events)
    url: https://www.x-tra.ch/de/programm/
    exclude: ["Party", "Disco"]     # Partys ausblenden (wie bei Dynamo/Nordportal)

  - id: dynamo
    name: Dynamo
    city: Zürich
    type: dynamo                    # Seite zeigt nur ~6 Wochen im Voraus
    url: https://www.dynamo.ch/events-kurse
    options: {kinds: [Konzert]}     # z.B. [Konzert, Party] für auch Partys

  - id: nordportal
    name: Nordportal
    city: Baden
    type: nordportal
    url: https://nordportal.ch/programm/all
    options: {kinds: [Liveshow]}    # [Liveshow, Party, Sonstiges] für alles

  # --- Bern / Basel ---
  - id: oldcapitol
    name: Old Capitol
    city: Langenthal
    type: petzi
    options: {organiser: 268307}

  - id: z7
    name: Z7 Konzertfabrik
    city: Pratteln
    type: css
    url: https://z-7.ch/
    options:
      item: "article:not(:has(article)):has(time[datetime])"   # innerste <article> mit Datum
      title: "h2"
      date: "time"
      date_attr: datetime
      link: "a[href*='/event/']"
      tags: "a span"                # Bühne («Mini Z7») bzw. auswärtiger Ort

  # --- Luzern ---
  - id: schuur
    name: Konzerthaus Schüür
    city: Luzern
    type: css                       # PETZI-Mitglied, verkauft aber über seetickets → eigene Seite
    url: https://www.schuur.ch/programm
    options:
      item: "section.viz-event-list-box"
      title: ".viz-event-name"
      date: "meta[itemprop=startDate]"
      date_attr: content
      time: ".viz-event-date"
      link: "a.viz-event-box-details-link"
      tags: ".viz-event-genre"

  # --- Solothurn ---
  - id: kofmehl
    name: Kulturfabrik Kofmehl
    city: Solothurn
    type: petzi
    options: {organiser: 37}

  # --- Vorlagen für weitere Locations (enabled: false) ---
  - id: beispiel_jsonld
    name: Beispiel (schema.org)
    city: Zürich
    type: jsonld
    url: https://www.beispiel.ch/programm
    enabled: false

  - id: beispiel_ical
    name: Beispiel (iCal-Feed)
    city: Basel
    type: ical
    url: https://www.beispiel.ch/events.ics
    enabled: false

  - id: beispiel_css
    name: Beispiel (CSS-Selektoren)
    city: Luzern
    type: css
    url: https://www.beispiel.ch/konzerte
    enabled: false
    options:
      item: "article.event"
      title: "h3"
      date: ".date"
      time: ".time"
      link: "a"
      tags: ".genre"
